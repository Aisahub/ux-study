name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Deployed with a cloud build (no `vercel pull`/`vercel build --prebuilt`)
      # rather than building locally on the runner: DATABASE_URL,
      # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are marked Sensitive in the
      # Vercel project, so `vercel pull` only ever returns the literal string
      # "[SENSITIVE]" for them outside Vercel's own build/runtime — a local
      # build here would migrate the database against that placeholder. A
      # cloud build runs on Vercel's infrastructure, where sensitive vars
      # resolve to their real values.
      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prod --token=$VERCEL_TOKEN)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "$URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Write production URL to summary
        run: |
          {
            echo "### Production deployment"
            echo ""
            echo "${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
